<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GALERI KARYA KOMPUTER - Portal Kumpul Karya Siswa SD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700;800&family=Kalam:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      // Jika membuka domain .vercel.app, cek dulu apakah ada karya tersangkut di localStorage browser ini.
      // Jika tidak ada karya tersangkut, langsung alihkan ke domain utama kirimtugaskomputer.my.id.
      if (window.location.hostname.endsWith('.vercel.app')) {
        try {
          var rawLocalSubs = localStorage.getItem('galeri_local_submissions');
          var parsedLocalSubs = rawLocalSubs ? JSON.parse(rawLocalSubs) : [];
          if (!Array.isArray(parsedLocalSubs) || parsedLocalSubs.length === 0) {
            window.location.replace('https://kirimtugaskomputer.my.id' + window.location.pathname + window.location.search);
          }
        } catch (e) {
          window.location.replace('https://kirimtugaskomputer.my.id' + window.location.pathname + window.location.search);
        }
      }
    </script>
  </head>
  <body class="bg-[#F8F7FF] text-slate-800 antialiased selection:bg-purple-100 selection:text-purple-700 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
